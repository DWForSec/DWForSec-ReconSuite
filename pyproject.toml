[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "dwforsec-reconsuite"
version     = "1.0.0"
description = "Offensive Reconnaissance & Attack Surface Mapping Platform"
readme      = "README.md"
requires-python = ">=3.11"
license     = { text = "MIT" }
keywords    = ["security", "recon", "offensive", "bug-bounty", "pentesting"]
authors     = [{ name = "DWForSec", email = "dwforsec@github.com" }]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "SQLAlchemy>=2.0.23",
    "aiosqlite>=0.19.0",
    "aiofiles>=23.2.1",
    "httpx>=0.25.0",
    "loguru>=0.7.2",
    "Jinja2>=3.1.2",
    "reportlab>=4.0.8",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
weasyprint = ["weasyprint>=60.2"]

[project.scripts]
dwforsec = "dwforsec.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["dwforsec*"]

[tool.setuptools.package-data]
"dwforsec.reports.templates" = ["*.html"]
"dwforsec.data"              = ["*.py"]
